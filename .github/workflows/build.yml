name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - run: cd frontend && npm ci || npm install
      
      - run: cd frontend && npm run build
      
      - run: cd frontend && npm run lint || echo "No lint script or lint failed, continuing"
  
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - run: cd backend && deno task check || echo "No check task or check failed, continuing"
      
      - run: cd backend && deno task lint || echo "No lint task or lint failed, continuing"
      
      - run: cd backend && deno task build || echo "No build task or build failed, continuing"
